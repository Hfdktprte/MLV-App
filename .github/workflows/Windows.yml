name: Windows Release

on:
  push:
    branches: [ "Experiments" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-make
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-libraw
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf

      - name: Build
        run: |
          mkdir -p platform/build
          cd platform/build
          /mingw64/bin/qmake-qt5.exe ../qt/MLVApp.pro
          /mingw64/bin/mingw32-make.exe -j2
          cd release
          /mingw64/bin/windeployqt-qt5.exe MLVApp.exe
          ldd MLVApp.exe | awk '/mingw64/ { print $3 }' | while IFS= read -r dll; do
            test -f "$dll" && cp -n "$dll" .
          done

      - name: Add bundled tools
        shell: pwsh
        run: |
          7z x platform/qt/FFmpeg/ffmpegWin64.zip -oplatform/build/release
          7z x platform/qt/raw2mlv/raw2mlvWin64.zip -oplatform/build/release
          Rename-Item platform/build/release MLVApp

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLVApp Windows 64bit
          path: platform/build/MLVApp
